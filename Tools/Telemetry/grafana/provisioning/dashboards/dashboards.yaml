# Loads every dashboard JSON file from the folder that INVENTORMCP_DASHBOARDS names (Tools/Telemetry/grafana/dashboards).

apiVersion: 1

providers:
  - name: inventor-mcp
    folder: Inventor MCP
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: ${INVENTORMCP_DASHBOARDS}

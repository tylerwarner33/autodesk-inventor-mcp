# Build verification for the Inventor MCP server.
#
# The point of this pipeline is that it runs on an agent with no Autodesk Inventor installed.
# That works only because Autodesk.Inventor.Interop is vendored under Libs/Inventor/<version>.
# If someone repoints the reference back at Program Files, this pipeline is what catches it.
#
# No signing or installer steps: this is a local developer tool with no distribution story yet.
# See Docs/Tasks/Reference-Repo-Findings.md, finding 11.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  solution: 'InventorMcp.slnx'

steps:
  - checkout: self

  - task: UseDotNet@2
    displayName: 'Install the .NET 10 SDK'
    inputs:
      packageType: 'sdk'
      version: '10.0.x'

  - task: DotNetCoreCLI@2
    displayName: 'Restore'
    inputs:
      command: 'restore'
      projects: '$(solution)'
      feedsToUse: 'config'
      nugetConfigPath: 'nuget.config'

  # TreatWarningsAsErrors is set in Directory.Build.props, so a warning fails the build here.
  - task: DotNetCoreCLI@2
    displayName: 'Build'
    inputs:
      command: 'build'
      projects: '$(solution)'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  # Produces the bundle layout an installer would ship, into the artifact staging directory
  # rather than the agent's Inventor add-ins folder.
  - task: DotNetCoreCLI@2
    displayName: 'Stage the add-in bundle'
    inputs:
      command: 'build'
      projects: 'Source/InventorMcp.AddIn/InventorMcp.AddIn.csproj'
      arguments: >-
        --configuration $(buildConfiguration)
        --no-restore
        -p:DeployBundle=true
        -p:InventorAddinsDir="$(Build.ArtifactStagingDirectory)/Addins"

  - task: CopyFiles@2
    displayName: 'Stage the MCP server'
    inputs:
      sourceFolder: 'Source/InventorMcp.Server/bin/$(buildConfiguration)'
      contents: '**'
      targetFolder: '$(Build.ArtifactStagingDirectory)/Server'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish artifacts'
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)'
      artifactName: 'inventor-mcp'

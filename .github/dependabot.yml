# One pull request each week for each ecosystem, so the updates are few and easy to review.
# The Dependabot changelog workflow adds the version to CHANGELOG.md and Directory.Build.props of each pull request.
# See .agents/rules/changelog.md, "Dependabot pull requests".
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # Roslyn inside Inventor runs beside the Roslyn of iLogic, so its version is chosen by hand, with a test in a live
      # session of each release. See .agents/rules/addin-isolation.md.
      - dependency-name: Microsoft.CodeAnalysis.*
      # The MCP library changes its telemetry and its experimental APIs between versions, so it is updated by hand.
      # See .agents/rules/telemetry.md, "A library update".
      - dependency-name: ModelContextProtocol*

  # Updates the SDK version in global.json. A new SDK brings new analyzer rules, and each one is a build error, so a
  # new SDK must come as a pull request. See Docs/Architecture.md, "The build enforces the code rules".
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly

  # Keeps the commit of each action in the workflows up to date. The actions are pinned to a commit, not to a tag,
  # because a tag can move to other code.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

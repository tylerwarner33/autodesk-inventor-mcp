# One pull request each week for each ecosystem, so the updates are few and easy to review.
# Each pull request still needs a version in CHANGELOG.md and Directory.Build.props before it can merge: the
# Changelog workflow fails on it until a person adds them. See .agents/rules/changelog.md.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # Roslyn inside Inventor runs beside the Roslyn of iLogic, so its version is chosen by hand, with a test in a live
      # session of each release. See .agents/rules/addin-isolation.md.
      - dependency-name: Microsoft.CodeAnalysis.*
      # The MCP library changes its telemetry and its experimental APIs between versions, so it is updated by hand.
      # See .agents/rules/telemetry.md, "A library update".
      - dependency-name: ModelContextProtocol*

  # Keeps the commit of each action in the workflows up to date. The actions are pinned to a commit, not to a tag,
  # because a tag can move to other code.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
